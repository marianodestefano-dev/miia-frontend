  <!-- Core → Protection -->
  <line x1="530" y1="450" x2="180" y2="600" stroke="#FF1744" stroke-width="1.5" opacity="0.4"/>
  <!-- Core → Agenda -->
  <line x1="600" y1="490" x2="600" y2="700" stroke="#00E5FF" stroke-width="1.5" opacity="0.4"/>
  <!-- Core → Prompts -->
  <line x1="540" y1="390" x2="350" y2="350" stroke="#7C3AED" stroke-width="1.5" opacity="0.4"/>
  <!-- Core → Postprocess -->
  <line x1="660" y1="390" x2="850" y2="350" stroke="#FF1744" stroke-width="1.5" opacity="0.4"/>
  <!-- Core → Sports -->
