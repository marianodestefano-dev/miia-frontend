<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <!-- Brand MIIA: cian → violeta → rojo -->
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>
    <linearGradient id="brand-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="violet-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1100" fill="#0f0f23" rx="16"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" fill="url(#brand-h)" font-size="32" font-weight="700" letter-spacing="2">MIIA BRAIN MAP</text>
  <text x="600" y="72" text-anchor="middle" fill="#9aa0a6" font-size="12">Arquitectura Cerebral Completa</text>

  <!-- ═══ CENTRO: MIIA CORE ═══ -->
  <circle cx="600" cy="420" r="70" fill="none" stroke="url(#brand)" stroke-width="3" filter="glow"/>
  <circle cx="600" cy="420" r="65" fill="#1a1a2e"/>
  <text x="600" y="410" text-anchor="middle" fill="#00E5FF" font-size="22" font-weight="700">MIIA</text>
