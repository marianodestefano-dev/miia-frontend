  <text x="200" y="188" text-anchor="middle" fill="#e8eaed" font-size="10">tenant_manager.js</text>
  <text x="200" y="205" text-anchor="middle" fill="#9aa0a6" font-size="9">tenant_message_handler.js</text>
  <text x="100" y="225" fill="#5f6368" font-size="9">Baileys + Multi-tenant</text>
  <text x="100" y="238" fill="#5f6368" font-size="9">Audio transcription</text>
  <text x="100" y="251" fill="#5f6368" font-size="9">Human delay + Anti-detect</text>

  <!-- ═══ NODO 2: AI Providers (arriba-derecha) ═══ -->
  <rect x="880" y="140" width="240" height="120" rx="12" fill="#1a1a2e" stroke="#7C3AED" stroke-width="1.5" filter="shadow"/>
  <text x="1000" y="168" text-anchor="middle" fill="#7C3AED" font-size="14" font-weight="700">AI Providers</text>
  <text x="1000" y="188" text-anchor="middle" fill="#e8eaed" font-size="10">Gemini Flash + Pro</text>
  <text x="1000" y="205" text-anchor="middle" fill="#9aa0a6" font-size="9">Google Search grounding</text>
  <text x="900" y="225" fill="#5f6368" font-size="9">Hybrid routing (Opus)</text>
  <text x="900" y="238" fill="#5f6368" font-size="9">Content Safety Shield</text>
  <text x="900" y="251" fill="#5f6368" font-size="9">Auto-fallback providers</text>

