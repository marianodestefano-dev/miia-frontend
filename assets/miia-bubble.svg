<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <!-- Colores BRAND MIIA oficiales: cian �� violeta → rojo/rosa -->
    <linearGradient id="miia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.3"/>
    </filter>
    <style>
      @keyframes pulse {
        0% { stroke-width: 3.5; opacity: 1; }
        50% { stroke-width: 6; opacity: 0.7; }
        100% { stroke-width: 3.5; opacity: 1; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); transform-origin: 48px 48px; }
        to { transform: rotate(360deg); transform-origin: 48px 48px; }
      }
      .ring-idle { stroke-width: 3.5; }
      .ring-listening { animation: pulse 1.2s ease-in-out infinite; }
      .ring-processing { animation: spin 1.5s linear infinite; stroke-dasharray: 160 140; }
    </style>
  </defs>
  <!-- Sombra exterior -->
  <circle cx="48" cy="48" r="44" fill="white" filter="url(#shadow)"/>
  <!-- Anillo degradé BRAND MIIA (cian → violeta → rojo) -->
  <circle cx="48" cy="48" r="44" fill="none" stroke="url(#miia-grad)" class="ring-idle"/>
  <!-- Fondo interior blanco -->
  <circle cx="48" cy="48" r="40" fill="white"/>
  <!-- Emoji MIIA saludando — grande, centrado -->
  <text x="48" y="64" text-anchor="middle" font-size="62" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji">🙋‍♀️</text>
</svg>
