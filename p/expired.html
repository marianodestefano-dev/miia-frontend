<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propuesta expirada</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #f4f7fa;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 48px 36px;
      text-align: center; max-width: 420px; width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { font-size: 24px; color: #0B3C5A; margin-bottom: 12px; }
    p { font-size: 15px; color: #5a6978; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #00AEEF; color: #fff; text-decoration: none;
      font-weight: 600; font-size: 15px;
      padding: 12px 28px; border-radius: 99px;
      transition: all .2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,174,239,.3); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"></div>
    <h1>Esta propuesta ha expirado</h1>
    <p>
      El enlace que recibiste ya no esta disponible.
      No te preocupes, tu asesor puede generarte una nueva propuesta actualizada en segundos.
    </p>
    <a class="btn" href="https://softwaremedilink.com" target="_blank">
      Visitar sitio web
    </a>
  </div>
</body>
</html>
